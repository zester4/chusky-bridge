name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check chusky_bridge tests
      - name: Test
        run: pytest -q
      - name: Validate manifests
        run: chusky-bridge validate connectors_manifests/templates
      - name: Migration SQL renders
        env:
          CHUSKY_DATABASE_URL: postgresql://offline/offline
        run: alembic upgrade head --sql > /dev/null

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chusky-bridge:ci .
