[project]
name = "chusky-bridge"
version = "1.0.0"
description = "Chusky Bridge: governed MCP access to legacy and modern enterprise systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "sqlglot>=25.0",
  "zeep>=4.2",
  "paramiko>=3.4",
  "defusedxml>=0.7",
  "kafka-python-ng>=2.2",
  "prometheus-client>=0.20",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
# Drivers for specific systems. Install only what the connected systems need.
odbc = ["pyodbc>=5.1"]                          # odbc, sql_server
sap = ["pyrfc>=3.0"]                            # sap_rfc (also needs the SAP NW RFC SDK)
mq = ["pymqi>=1.12", "pika>=1.3"]               # ibm_mq, rabbitmq
industrial = ["pymodbus>=3.6", "opcua>=0.98"]  # modbus, opcua
dicom = ["pynetdicom>=2.0", "pydicom>=2.4"]     # dicom
rpa = ["pywinauto>=0.6.8"]                      # rpa (Windows)
tn3270 = ["py3270>=0.1"]                        # tn3270 (also needs x3270)
redis = ["redis>=5.0"]                          # rate_limit_backend = redis
aws = ["boto3>=1.34"]                           # secret_vault_provider = aws
all = [
  "pyodbc>=5.1", "pyrfc>=3.0", "pymqi>=1.12", "pika>=1.3", "pymodbus>=3.6", "opcua>=0.98",
  "pynetdicom>=2.0", "pydicom>=2.4", "pywinauto>=0.6.8", "py3270>=0.1", "redis>=5.0", "boto3>=1.34",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
chusky-bridge = "chusky_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chusky_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
