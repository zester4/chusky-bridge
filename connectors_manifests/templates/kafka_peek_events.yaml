# TEMPLATE. Peek only. Offsets are read-only and no consumer group is created.
connector:
  name: order_events
  type: kafka
  version: 0.1.0
  status: template

connection:
  bootstrap_servers: kafka-1.example.internal:9093,kafka-2.example.internal:9093
  security_protocol: SASL_SSL
  sasl_mechanism: SCRAM-SHA-512
  username: svc_chusky_read
  secret_ref: kafka_sasl_password
  allowed_topics: [orders.v1]
  timeout_seconds: 5
  max_rows: 50

operations:
  peek_order_events:
    description: Read up to max_messages from one partition starting at an offset. Read-only.
    mode: peek
    topic: orders.v1
    parameters: [partition, offset, max_messages]
    input_schema:
      type: object
      properties:
        partition: {type: integer, minimum: 0, maximum: 1000}
        offset: {type: integer, minimum: 0}
        max_messages: {type: integer, minimum: 1, maximum: 50}
      required: [partition, offset, max_messages]
    risk_level: low
    read_only: true
    requires_approval: false
    required_scopes: [events.orders.read]
