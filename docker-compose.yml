services:
  chusky-bridge-api:
    build: .
    command: uvicorn chusky_bridge.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  chusky-bridge-worker:
    build: .
    command: python -m chusky_bridge.workers.sync_worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chusky-bridge
      POSTGRES_PASSWORD: chusky-bridge
      POSTGRES_DB: chusky-bridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chusky-bridge"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
