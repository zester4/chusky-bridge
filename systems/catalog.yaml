# Chusky Bridge system catalog.
#
# Each entry names a system and the adapter expected to reach it. Mappings follow commonly documented
# vendor integration interfaces. Every entry is UNVERIFIED until a connector has been tested against a
# real instance of that product and version. Licensing, enabled modules, and version change what is
# available, so confirm the interface your installation actually exposes.
#
# era: legacy (mainframe, midrange, or 10+ years old), midlife (5-10 years), modern (cloud or current on-prem)
# adapter: one of the adapters in chusky_bridge/connectors (see docs/adapters.md)
